name: Build Packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-deb:
    runs-on: ubuntu-latest 
    strategy:
      matrix:
        include:
          - version: "24.04"
            codename: "noble"
            distro: "ubuntu"
          - version: "25.10"
            codename: "questing"
            distro: "ubuntu"
          - version: "26.04"
            codename: "resolute"
            distro: "ubuntu"
          - version: "13"
            codename: "trixie"
            distro: "debian"

    container:
      image: ghcr.io/zaneni6/fastflowlm/build-environment:${{ matrix.distro }}${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          # Strip leading 'v' for Debian version compatibility
          DEB_VERSION=$(echo "${VERSION}" | sed 's/^v//')
          # Debian versions must start with a digit; prefix bare SHAs with 0.0.0+git
          echo "${DEB_VERSION}" | grep -q '^[0-9]' || DEB_VERSION="0.0.0+git${DEB_VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deb_version=${DEB_VERSION}" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Debian packaging metadata
        working-directory: ${{ github.workspace }}
        run: |
          sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.deb_version }}|g" \
              -e "s|@@DEB_CODENAME@@|${{ matrix.codename }}|g" \
              -e "s|@@DEB_DATE@@|$(date -R)|g" \
              debian/changelog.in > debian/changelog

          chmod +x debian/rules

      - name: Upgrade Rust toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates zip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustc --version

      - name: Build Debian package
        working-directory: ${{ github.workspace }}
        env:
          DEBEMAIL: noreply@example.com
          DEBFULLNAME: fastflowlm
          DEB_VERSION: ${{ steps.get_version.outputs.deb_version }}
        run: |
          dpkg-buildpackage -b -us -uc
          mv ../fastflowlm_${DEB_VERSION}_amd64.deb ./fastflowlm_${DEB_VERSION}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb
          ls -lah ./fastflowlm_${DEB_VERSION}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-${{ matrix.distro }}${{ matrix.version }}-${{ steps.short_sha.outputs.sha }}-deb
          path: ./fastflowlm_${{ steps.get_version.outputs.deb_version }}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb
          if-no-files-found: error

      - name: Create portable zip
        working-directory: ${{ github.workspace }}
        env:
          DEB_VERSION: ${{ steps.get_version.outputs.deb_version }}
          DISTRO: ${{ matrix.distro }}
          DISTRO_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          dist="dist"
          rm -rf "$dist"
          mkdir -p "$dist"

          # Extract the binary from the deb package
          dpkg-deb --fsys-tarfile "./fastflowlm_${DEB_VERSION}_${DISTRO}${DISTRO_VERSION}_amd64.deb" \
            | tar -x --wildcards './usr/bin/flm' -O > "$dist/flm"
          chmod +x "$dist/flm"

          # Bundle runtime assets (same set as Windows)
          cp -r src/xclbins "$dist/"
          cp src/model_list.json "$dist/"
          cp src/lib/*.so* "$dist/" 2>/dev/null || true

          zip_name="fastflowlm_${DEB_VERSION}_${DISTRO}${DISTRO_VERSION}_amd64.zip"
          cd "$dist"
          zip -r "../${zip_name}" .
          cd ..
          ls -lah "${zip_name}"

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-${{ matrix.distro }}${{ matrix.version }}-${{ steps.short_sha.outputs.sha }}-zip
          path: ./fastflowlm_${{ steps.get_version.outputs.deb_version }}_${{ matrix.distro }}${{ matrix.version }}_amd64.zip
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-deb
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          pattern: '*-deb'

      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          path: zips
          pattern: '*-zip'

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: |
            debs/*/*.deb
            zips/*/*.zip
