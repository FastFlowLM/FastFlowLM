title: "FastFlowLM"
description: "The leading LLM inference runtime for parallel NPU architectures"
url: "https://fastflowlm.com"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false

exclude:
  - venv
  - build.py
  - dev.py
  - templates
  - sync-layout.js
  - docs/_config.yml

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: docs
      toc: true

nav_links:
  - label: Technology
    children:
      - label: Models
        url: "/models/"
      - label: Benchmarks
        url: "/benchmarks/"
      # - label: Demos
      #   url: "/demos/"
  - label: Docs
    url: "/docs/"

cta_links:
  - label: GitHub
    url: "https://github.com/ROCm/FastFlowLM"
    icon: github
  - label: Discord
    url: "https://discord.com/invite/jtWZdMJ8ee?utm_source=site"
    icon: discord
  - label: YouTube
    url: "https://www.youtube.com/@FastFlowLM-YT/playlists"
    icon: youtube
  - label: Email
    url: "mailto:info@fastflowlm.com"
    icon: mail

